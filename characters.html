<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC 設定集 - 穩定運作版</title>
    <style>
        /* 選項 */
        .navar ul{list-style-type: none; background-color: rgb(255, 255, 255);margin: auto;padding: 0;position: fixed;top: 0;width: 100%;z-index: 1000; text-align: center;}
        .navar a{color: black;text-decoration: none;padding: 15px; display: block;text-align: center;}
        .navar a:hover{background-color: rgb(240, 240, 240);}
        .navar li{display: inline-block;}

        /* 基礎風格 */
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

        /* 視覺設計：黑線大標 */
        .main-title { font-size: 2.2em; border-bottom: 5px solid #000; padding-bottom: 10px; margin-bottom: 30px; font-weight: 900; }

        /* 連結與按鈕樣式 */
        .btn-link { color: #000; font-weight: bold; cursor: pointer; text-decoration: underline; display: inline-block; margin-top: 10px; }
 
        /* OC 預覽框 */
        .oc-box { display: flex; gap: 20px; background: #f4f4f4; padding: 20px; margin-bottom: 30px; border: 1px solid #ddd; align-items: center; }
        .oc-img { width: 100px; height: 100px; background: #bbb; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
 
        /* 頁面隱藏與顯示 (核心) */
        .page { display: none; }
        .active { display: block !important; animation: fadeIn 0.3s; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <section id="home" class="page active">
        <nav class="navar">
            <ul>
                <li><a href="index.html">首頁</a></li>
                <li><a href="characters.html">角色</a></li>
                <li><a href="stories.html">故事</a></li>
                <li><a href="gallery.html">畫廊</a></li>
            </ul>
        </nav>
                <div class="container">
            <div class="oc-box">
                <div class="oc-img">OC 照片</div>
                <div>
                    <div class="btn-link" style="font-size: 1.4em;" onclick="showPage('oc-detail')">角色名字</div>
                    <p>簡易標籤：性別 / 年齡 / 職業</p>
                </div>
            </div>

            <h1 class="main-title">故事標題：某個重要事件</h1>
            <p>這裡寫詳細的故事內容，可以分很多段。對應你第二張草圖的設計。</p>
        </div>
    </section>
</body>
</html>
