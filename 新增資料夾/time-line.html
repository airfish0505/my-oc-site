<!DOCTYPE html>

    <title>OC 設定集 - 穩定運作版</title>
    <style>
        /* 選項 */
        .navar ul{list-style-type: none; background-color: rgb(255, 255, 255);margin: auto;padding: 0;position: fixed;top: 0;width: 100%;z-index: 1000; text-align: center;}
        .navar a{color: black;text-decoration: none;padding: 15px; display: block;text-align: center;}
        .navar a:hover{background-color: rgb(240, 240, 240);}
        .navar li{display: inline-block;}

        /* 基礎風格 */
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

        /* 頂部 Banner */
        .banner { background: #ffffff; height: 30px; display: flex; align-items: center; justify-content: center; position: relative; }

        /* 視覺設計：黑線大標 */
        .main-title { font-size: 2.2em; border-bottom: 5px solid #000; padding-bottom: 10px; margin-bottom: 30px; font-weight: 900; }
        .oc-name { text-align: center;margin: 10px;font-size: 20px;padding: 0;}

        /* 連結與按鈕樣式 */
        .btn-link { color: #000; font-weight: bold; cursor: pointer; display: inline-block; margin-top: 10px; text-decoration: underline; }
        
        /* 返回按鈕 */
        .back-btn { color: #888; cursor: pointer; margin-bottom: 20px; font-size: 0.9em; }

        /* OC 預覽框 */
        .oc-box { display: inline-block;margin: 15px;}
        .oc-img { width: 130px; height: 180px; background: #bbb; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
 
         /* 頁面隱藏與顯示 (核心) */
        .page { display: none; }
        .active { display: block !important; animation: fadeIn 0.3s; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
